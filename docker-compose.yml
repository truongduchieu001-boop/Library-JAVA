services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: group18-library-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Library@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - library_sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Library@123456" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  library_sqlserver_data:
