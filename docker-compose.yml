services:
  mysql:
    image: mysql:8.4
    container_name: group18-library-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
    ports:
      - "3307:3306"
    volumes:
      - library_mysql_data:/var/lib/mysql
      - ./database/library_management_group18.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  library_mysql_data:
